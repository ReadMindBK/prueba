<!doctype html>
<html lang="es">
<head>
  <!-- =========================================================
       01. DATOS GENERALES DE LA PÁGINA
       ========================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6b3047">
  <meta name="description" content="Presentación interactiva de personajes READMIND.">
  <title>READMIND | Presentación del personaje</title>

  <style>
    /* =========================================================
       02. CONFIGURACIÓN EDITABLE
       Modificá estos valores para ajustar la imagen y el diseño.
       La imagen NO tiene aro, círculo, recorte ni relleno.
       ========================================================= */
    :root {

/* POSICIÓN VERTICAL DE LOS ELEMENTOS */
--ancho-pagina: 563px;
--posicion-audio: 70px;
--posicion-barra: 70px;
--posicion-codigo: 80px;
--posicion-volver: 110px;
--posicion-bloque: 0px;

      --ancho-pagina: 563px;

      /* POSICIÓN Y TAMAÑO DE LA IMAGEN DEL PERSONAJE */
      --imagen-ancho: 140%;       /* Ancho de la imagen */
      --imagen-alto: 332px;      /* Alto máximo de la imagen */
      --imagen-x: 50%;           /* Posición horizontal: 50% = centro */
      --imagen-y: 8px;           /* Distancia desde arriba */
      --imagen-trasladar-x: -50%;/* Mantener -50% para centrar en imagen-x */

      /* COLORES */
      --bordo: #6b3047;
      --violeta: #736783;
      --dorado: #ffdf86;
      --blanco: #ffffff;
    }

    /* =========================================================
       03. REGLAS GENERALES Y CENTRADO
       La página mantiene una columna centrada de máximo 563 px,
       igual que el contenido central de Scanner Mind.
       ========================================================= */
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bordo);
      color: var(--blanco);
    }

    /* =========================================================
       04. ENCABEZADO SCANNER MIND
       COPIA DEL ENCABEZADO DE LA WEB PRINCIPAL:
       - misma imagen y dimensiones
       - mismo título y subtítulo
       - misma ubicación de los textos
       - misma animación scannerHeartbeat
       ========================================================= */
.app-header {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 129px;
  min-height: 129px;
  flex: 0 0 129px;
  padding: 0;
  background-color: #6b3047;
  background-image: url("./assets/header-scanner.jpg");
  background-position: center top;
  background-size: 563px 129px;
  background-repeat: no-repeat;
  box-shadow: none;
}

    .header-content {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 2;
    }

    .brand-title {
      font-family: Arial, sans-serif;
      font-size: 43px;
      font-weight: 300;
      letter-spacing: 3px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 2px 5px #14253f99;
      transform-origin: center center;
      animation: scannerHeartbeat 3.2s ease-in-out infinite;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
      text-shadow: 0 1px 4px #333;
    }

    @keyframes scannerHeartbeat {
      0%, 100% {
        transform: scale(1);
        text-shadow: 0 0 3px #fff, 0 0 7px #fff, 0 0 1px #fff;
      }
      45% {
        transform: scale(1.045);
        text-shadow: 0 0 4px #fff, 0 0 10px #fff, 0 0 17px #ffffffaa;
      }
      58% {
        transform: scale(1.015);
        text-shadow: 0 0 4px #fff, 0 0 9px #fff, 0 0 12px #ffffff88;
      }
    }

    /* =========================================================
       05. CONTENEDOR CENTRAL
       Centrado y con tamaño máximo igual al de Scanner Mind.
       ========================================================= */
    main {

position: relative;
top: var(--posicion-bloque);
      z-index: 1;
      width: min(100%, var(--ancho-pagina));
      height:100px;
      min-height: 100px;
      flex: 0 0 750px;
      margin: 0 auto;
      padding: 12px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(ellipse at 50% 35%, #93849e 0%, #756780 58%, #66536f 100%);
    }

    /* =========================================================
       06. ÁREA DE LA IMAGEN DEL PERSONAJE
       La imagen se coloca libremente con las variables del punto 02.
       No hay aro oscuro, círculo, fondo gris ni recorte circular.
       La imagen puede incluir su propio aro como parte del archivo.
       ========================================================= */
    .character-stage {
      position: relative;
      width: 100%;
      height: 292px;
      flex: 0 0 292px;
      margin: 0 auto 8px;
      overflow: visible;
    }

    .character-image {
      position: absolute;
      left: var(--imagen-x);
      top: var(--imagen-y);
      width: var(--imagen-ancho);
      height: var(--imagen-alto);
      max-width: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: translateX(var(--imagen-trasladar-x));
    }

    /* Nombre curvado sobre la ilustración. */
    .character-name {
      position: absolute;
      z-index: 2;
      top: 35px;
      left: 0;
      width: 100%;
      height: 76px;
      overflow: visible;
      pointer-events: none;
    }

    .character-name text {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 43px;
      letter-spacing: 2px;
      fill: #fff;
      paint-order: stroke;
      stroke: #66536f;
      stroke-width: 1.5px;
    }

    /* =========================================================
       07. BOTÓN DE AUDIO
       ========================================================= */
    .player {
position: relative;
top: var(--posicion-audio);
      width: min(35%, 250px);
      height: 62px;
      flex: 0 0 62px;
      margin: 0 auto 17px;
      border: 0;
      border-radius: 20px;
      background: var(--dorado);
      color: #806181;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 2px 3px #4d385033;
      cursor: pointer;
    }

    .player:active, 
    .back:active { transform: scale(.98); }

    /* =========================================================
       08. BARRA DE PROGRESO Y TIEMPO DEL AUDIO
       ========================================================= */
.progress-wrap {

  position: relative;
  top: var(--posicion-barra);
  width: 60%;
  padding: 0 3px;
  margin: 0 auto 20x;
  align-self: center;
  transform: translateX(70px);
}

background: linear-gradient(
  to right,
  #ffdf86 0%,
  #ffdf86 var(--avance, 0%),
  #a18da9 var(--avance, 0%),
  #a18da9 100%
);
.progress {
  width: 100%;
  height:5px;
  display: block;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  accent-color: #ffdf86;
  background: transparent;
  cursor: pointer;
  outline: none;
}

/* Línea de progreso para Chrome y Edge */
.progress::-webkit-slider-runnable-track {
  height: 8px;
  border-radius: 20px;
  background: linear-gradient(
    to right,
    #ffdf86 0%,
    #ffdf86 var(--avance, 0%),
    #a18da9 var(--avance, 0%),
    #a18da9 100%
  );
}

/* Punto amarillo para Chrome y Edge */

.progress::-webkit-slider-thumb {
  width: 22px;
  height: 22px;
  margin-top: -5px;
  appearance: none;
  -webkit-appearance: none;
  border: none !important;
  border-radius: 50%;
  background: #ffdf86 !important;
  box-shadow: none !important;
}
.progress {
  accent-color: #ffdf86 !important;
}

.progress::-moz-range-thumb {
  background: #ffdf86 !important;
  border: none !important;
  box-shadow: none !important;
}

/* Línea para Firefox */
.progress::-moz-range-track {
  height: 8px;
  border-radius: 20px;
  background: #a18da9;
}

.progress::-moz-range-progress {
  height: 8px;
  border-radius: 20px;
  background: #ffdf86;
}

/* Punto amarillo para Firefox */
.progress::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 50%;
  background: #ffdf86;
}

    .progress::-webkit-slider-thumb {
      width: 16px;
      height: 16px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 50%;
      background: var(--dorado);
    }

    .progress::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: var(--dorado);
    }

    .time {
      margin-top: 9px;
      color: #fff;
      font-size: 18px;
      font-weight: 400;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transform: translateX(-70px);
    }

    /* =========================================================
       09. CÓDIGO SECRETO
       Antes del momento indicado solo se muestra "CODIGO:".
       ========================================================= */
    .code-box {
position: relative;
top: var(--posicion-codigo);
      width: min(55%, 500px);
      min-height: 76px;
      margin: 0 0 28px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 24px;
      background: #3f3045a8;
      color: #fff;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: .5px;
      text-align: center;
    }

    .code-value { display: inline-block; font-weight: 500; }

    /* =========================================================
       10. BOTÓN VOLVER
       ========================================================= */
    .back {
position: relative;
top: var(--posicion-volver);
      width: 140px;
      height: 30px;
      flex: 0 0 56px;
      border: 0;
      border-radius: 14px;
      background: var(--bordo);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 6px #34233722;
    }

    /* =========================================================
       11. ADAPTACIÓN A CELULARES
       ========================================================= */
    @media (max-width: 600px) {
.app-header {
  height: 129px;
  min-height: 129px;
  flex: 0 0 129px;
  background-size: 563px 129px;
  background-position: center top;
}
      .header-content { top: 50px; }
      .brand-title { font-size: 43px; }
      .brand-subtitle { font-size: 14px; }
      main { padding: 10px 16px 20px; }
      .character-stage { height: 270px; flex-basis: 270px; }
      .player { height: 48px; flex-basis: 48px; }
      .progress-wrap { margin-bottom: 23px; }
      .code-box { min-height: 68px; margin-bottom: 22px; }
      .back { height: 44px; flex-basis: 44px; }
    }

    @media (max-height: 700px) {
      main { padding-top: 6px; padding-bottom: 14px; }
      .character-stage { height: 220px; flex-basis: 220px; }
      .player { height: 52px; flex-basis: 52px; margin-bottom: 10px; }
      .progress-wrap { margin-bottom: 15px; }
      .code-box { min-height: 58px; margin-bottom: 15px; }
      .back { height: 46px; flex-basis: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-title { animation-duration: 6s; }
    }
  </style>
</head>

<body>
  <!-- =========================================================
       12. ENCABEZADO PRINCIPAL
       Mantener estos textos iguales a Scanner Mind.
       ========================================================= -->
  <header class="app-header">
    <div class="header-content">
      <div class="brand-title">SCANNER MIND</div>
      <div class="brand-subtitle">EXPLORA - DESCUBRE - APRENDE</div>
    </div>
  </header>

  <!-- =========================================================
       13. PRESENTACIÓN VISUAL DEL PERSONAJE
       La imagen es un archivo completo e independiente.
       ========================================================= -->
  <main>
    <section class="character-stage" aria-label="Presentación del personaje">
      <img class="character-image" id="characterImage"
           src="./personajes/mito/imagen1.png"
           alt="Ilustración de la Esfinge">

      <svg class="character-name" viewBox="0 0 400 100" aria-hidden="true">
        <defs>
          <path id="nameArc" d="M 34,91 Q 200,-25 366,91" />
        </defs>
        <text>
          <textPath id="nameTextPath" href="#nameArc" startOffset="50%" text-anchor="middle"></textPath>
        </text>
      </svg>
    </section>

    <!-- =======================================================
         14. REPRODUCTOR DE AUDIO
         ======================================================= -->
    <button class="player" id="playButton" type="button">▶ ESCUCHAR</button>

    <div class="progress-wrap">
      <input class="progress" id="progress" type="range"
             min="0" max="258" value="0" step="0.1"
             aria-label="Progreso del audio">
      <div class="time" id="timeLabel">00:00 / 04:18</div>
    </div>

    <!-- =======================================================
         15. CÓDIGO QUE APARECE EN EL MOMENTO CONFIGURADO
         ======================================================= -->
    <div class="code-box" aria-live="polite">
      <span id="codeLabel">CODIGO:</span>
      <span class="code-value" id="codeValue"></span>
    </div>

    <!-- =======================================================
         16. VOLVER AL ESCÁNER
         ======================================================= -->
    <button class="back" id="backButton" type="button">VOLVER</button>
  </main>

  <!-- =========================================================
       17. ARCHIVO DE AUDIO DEL PERSONAJE
       ========================================================= -->
  <audio id="characterAudio" preload="metadata"
         src="./personajes/mito/audio1.mp3"></audio>

  <script>
    /* =========================================================
       18. DATOS EDITABLES DEL PERSONAJE
       Para crear otro personaje, cambiá solamente estos datos.
       momentoCodigo se expresa en segundos desde el inicio.
       Ejemplo: 155 = 2 minutos y 35 segundos.
       ========================================================= */
    const PERSONAJE = {
      nombre: "ESFINGE",
      imagen: "./personajes/mito/imagen1.png",
      audio: "./personajes/mito/audio1.mp3",
      codigo: "N",
      momentoCodigo: "01:44",
      duracionInicial: "01:46",
    };

    /* =========================================================
       19. REFERENCIAS A LOS ELEMENTOS DE LA PÁGINA
       ========================================================= */
    const audio = document.getElementById("characterAudio");
    const playButton = document.getElementById("playButton");
    const progress = document.getElementById("progress");
    const timeLabel = document.getElementById("timeLabel");
    const codeValue = document.getElementById("codeValue");
    const characterImage = document.getElementById("characterImage");
    const nameTextPath = document.getElementById("nameTextPath");

    /* =========================================================
       20. CARGAR LOS DATOS DEL PERSONAJE
       ========================================================= */
    let duration = PERSONAJE.duracionInicial;
    document.title = "READMIND | " + PERSONAJE.nombre;
    characterImage.src = PERSONAJE.imagen;
    characterImage.alt = "Ilustración de " + PERSONAJE.nombre;
    nameTextPath.textContent = PERSONAJE.nombre;
    audio.src = PERSONAJE.audio;

    /* =========================================================
       21. FUNCIONES DEL REPRODUCTOR Y DEL CÓDIGO
       El código aparece/desaparece al avanzar o retroceder el audio.
       ========================================================= */
    function formatTime(value) {
      if (!Number.isFinite(value)) return "00:00";
      const seconds = Math.floor(value);
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return String(minutes).padStart(2, "0") + ":" + String(remainder).padStart(2, "0");
    }

    // Convierte MM:SS a segundos.
function timeToSeconds(time) {
  const parts = time.split(":");
  const minutes = Number(parts[0]);
  const seconds = Number(parts[1]);

  return (minutes * 60) + seconds;
}

// Controla cuándo aparece la letra.
function updateCode() {
  const momento = timeToSeconds(PERSONAJE.momentoCodigo);

  if (audio.currentTime >= momento) {
    codeValue.textContent = PERSONAJE.codigo;
  } else {
    codeValue.textContent = "";
  }
}

    function updatePlayer() {
      const now = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      timeLabel.textContent = formatTime(now) + " / " + formatTime(duration);
      progress.value = now;
const porcentaje = duration > 0 ? (now / duration) * 100 : 0;
progress.style.setProperty("--avance", porcentaje + "%");
      updateCode();
      playButton.textContent = audio.paused ? "▶ ESCUCHAR" : "Ⅱ PAUSAR";
    }

    /* =========================================================
       22. EVENTOS DEL AUDIO Y CONTROLES
       ========================================================= */
    playButton.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          alert("No se pudo reproducir el audio. Verificá que exista: " + PERSONAJE.audio);
        }
      } else {
        audio.pause();
      }
      updatePlayer();
    });

    audio.addEventListener("loadedmetadata", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        duration = audio.duration;
        progress.max = duration;
      }
      updatePlayer();
    });

    audio.addEventListener("timeupdate", updatePlayer);
    audio.addEventListener("seeked", updatePlayer);
    audio.addEventListener("play", updatePlayer);
    audio.addEventListener("pause", updatePlayer);
    audio.addEventListener("ended", updatePlayer);

    progress.addEventListener("input", () => {
      audio.currentTime = Number(progress.value);
      updatePlayer();
    });

    /* =========================================================
       23. BOTÓN VOLVER
       Si la presentación se abrió desde Scanner Mind, vuelve a
       la página anterior. Si se abrió sola, vuelve a index.html.
       ========================================================= */
    document.getElementById("backButton").addEventListener("click", () => {
      audio.pause();
      audio.currentTime = 0;
      if (document.referrer && new URL(document.referrer).origin === location.origin) {
        history.back();
      } else {
        location.href = "./index.html";
      }
    });

    /* =========================================================
       24. ESTADO INICIAL
       ========================================================= */
    updatePlayer();
  </script>
</body>
</html>
